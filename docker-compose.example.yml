# Referência para o servidor (~/services/ror2-selector/docker-compose.yml).

services:
  ror2-selector:
    image: ghcr.io/cirillom/ror2-selector:latest
    container_name: ror2-selector
    restart: always

    environment:
      - TZ=America/Sao_Paulo

    volumes:
      - /mnt/hdd/ror2-selector/data:/data

    networks:
      - proxy

networks:
  proxy:
    external: true
